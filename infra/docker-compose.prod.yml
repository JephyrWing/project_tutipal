services:
  backend:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/tutipal-back:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://tutipal-db:5432/${DB_NAME:-tutipal_db}
      DB_USER: ${DB_USER:-tutipal}
      DB_PW: ${DB_PW:?Set DB_PW}
      # PT-110: AI node address. PC AI server through Cloudflare: https://ai.<domain> (docs/DEPLOYMENT.md 7).
      # FastAPI on this host (old layout): http://fastapi:8000 together with --profile ec2-ai.
      FAST_API_BASE_URL: ${FAST_API_BASE_URL:?Set FAST_API_BASE_URL (https://ai.<domain> or http://fastapi:8000 with --profile ec2-ai)}
      # PT-110 Cloudflare Access service token for the AI hostname. Both empty = no header (same-host FastAPI).
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      # PT-110: whole-request limits of the short AI calls (defaults = application.yaml). Raise only if the
      # measured tunnel latency needs it (docs/DEPLOYMENT.md 7.6); keep RERANK_QUEUE_TIMEOUT_MS below the rerank one.
      TUTIPAL_RAG_RERANK_TIMEOUT: ${TUTIPAL_RAG_RERANK_TIMEOUT:-2s}
      APP_FOCUS_PREDICT_TIMEOUT: ${APP_FOCUS_PREDICT_TIMEOUT:-2s}
      # PT-86: RAG rerank flag and chunker (docs/AI_WORKFLOW_CONTRACT.md 3.1, docs/RAG_REINDEX.md)
      TUTIPAL_RAG_RERANK_ENABLED: ${TUTIPAL_RAG_RERANK_ENABLED:-false}
      # measured/frozen candidate count (docs/PT-86_RAG_EVAL.md 3), same as the application.yaml default
      TUTIPAL_RAG_RERANK_CANDIDATES: ${TUTIPAL_RAG_RERANK_CANDIDATES:-10}
      TUTIPAL_MATERIALS_CHUNKER: ${TUTIPAL_MATERIALS_CHUNKER:-char800-v1}
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?Set AI_INTERNAL_KEY}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-2}
      # PT-85: FastAPI(/v1/agent/chat)를 먼저 배포한 뒤 켠다. false면 모든 역할이 기존 /v1/chat 경로
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
      DEV_LOGIN: "false"
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?Set the Spring public HTTPS origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      SESSION_COOKIE_SECURE: "true"
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-}
      MATERIAL_STORAGE: ${MATERIAL_STORAGE:-s3}
      MATERIAL_LOCAL_PATH: /app/data/materials
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - tutipal_materials:/app/data
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      tutipal-db:
        condition: service_healthy
      # only with --profile ec2-ai (FastAPI on this host); ignored when the AI runs on the PC node
      fastapi:
        condition: service_healthy
        required: false
      livekit:
        condition: service_started
    restart: unless-stopped
    networks: [app, data, model, realtime]

  # PT-110: the AI now runs on the PC node (infra/docker-compose.ai-node.yml). This same-host FastAPI is kept
  # as a fallback layout and starts only with --profile ec2-ai (deploy.sh: ENABLE_EC2_AI=true).
  fastapi:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/tutipal-fastapi:${IMAGE_TAG:?Set IMAGE_TAG}
    profiles: [ec2-ai]
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?Set AI_INTERNAL_KEY}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      MODEL_NAME: ${MODEL_NAME:-gemma3:12b}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MAX_COMPLETION_TOKENS: ${OPENAI_MAX_COMPLETION_TOKENS:-4096}
      EMBEDDING_DIMENSIONS: "1024"
      # PT-86 /v1/rerank (model is baked into the image; off by default, Spring flag is separate)
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_THREADS: ${RERANK_THREADS:-2}
      RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-256}
      # below Spring timeout (2s): give up waiting behind another rerank instead of piling up
      RERANK_QUEUE_TIMEOUT_MS: ${RERANK_QUEUE_TIMEOUT_MS:-1000}
      # PT-90 /v1/focus/predict: LightGBM text model (not in the image). Empty = model off, only that path is 503
      FOCUS_MODEL_PATH: ${FOCUS_MODEL_PATH:-}
      FOCUS_MODEL_SHA256: ${FOCUS_MODEL_SHA256:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/ai/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # PT-86: reranker model loads at startup
      start_period: 30s
    restart: unless-stopped
    networks: [model]

  tutipal-db:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/tutipal-db:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      POSTGRES_DB: ${DB_NAME:-tutipal_db}
      POSTGRES_USER: ${DB_USER:-tutipal}
      POSTGRES_PASSWORD: ${DB_PW:?Set DB_PW}
    volumes:
      - tutipal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [data]

  livekit:
    image: livekit/livekit-server:v1.13.11
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:?Set externally reachable media IP}
    expose: ["7880"]
    ports: ["7881:7881/tcp", "7882:7882/udp"]
    restart: unless-stopped
    networks: [realtime]

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: [cloudflare]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [backend]
    restart: unless-stopped
    networks: [app]

networks:
  app:
  data:
    internal: true
  model:
  realtime:

volumes:
  tutipal_pgdata:
  tutipal_materials:
