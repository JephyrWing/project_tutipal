name: Build and deploy TUTIPAL

on:
  push:
    branches: [develop]
    paths: ["tutipal_back/**", "tutipal_front/**", "tutipal_ai/**", "infra/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutipal-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: checks
    # 기본은 CI만 실행. 서버와 Secrets 준비 후 Repository variable ENABLE_CD=true로 활성화한다.
    if: vars.ENABLE_CD == 'true' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: tutipal_back
            image: tutipal-back
          - context: tutipal_ai
            image: tutipal-fastapi
    steps:
      - uses: actions/checkout@v4
      - name: Read application version from build.gradle
        id: version
        run: |
          version=$(sed -nE "s/^version *= *['\"]([^'\"]+)['\"].*/\1/p" tutipal_back/build.gradle | head -n 1)
          echo "app=${version:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          # tutipal-back이 기동 로그에 남기는 값. 다른 이미지에서는 쓰이지 않는다.
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.app }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload deployment definitions from the same commit
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/docker-compose.prod.yml,infra/deploy.sh"
          target: "app"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          IMAGE_REGISTRY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          ENABLE_CLOUDFLARE: ${{ vars.ENABLE_CLOUDFLARE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: IMAGE_REGISTRY,IMAGE_TAG,ENABLE_CLOUDFLARE
          script: |
            set -eu
            cd ~/app
            sh infra/deploy.sh
