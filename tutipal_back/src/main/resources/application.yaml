spring:
  application:
    name: tutipal-back
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/tutipal_db}
    username: ${DB_USER:tutipal}
    password: ${DB_PW}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  autoconfigure:
    # 실제 사용자 저장소를 구현하기 전 임시 기본 사용자/비밀번호 생성을 막는다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  tomcat:
    max-part-header-size: 2KB
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 2h
      cookie:
        name: TUTIPAL_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

tutipal:
  ai:
    base-url: ${FAST_API_BASE_URL:http://fastapi:8000}
  livekit:
    internal-url: ${LIVEKIT_INTERNAL_URL:http://livekit:7880}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    # 실제 토큰 생성에서도 false를 강제한다.
    can-publish-data: false
    token-ttl: 60s
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET:}

app:
  dev-login: ${DEV_LOGIN:false}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://127.0.0.1:*,http://localhost:*}
  ai:
    base-url: ${FAST_API_BASE_URL:http://fastapi:8000}
    internal-key: ${AI_INTERNAL_KEY:}
    max-concurrent: ${AI_MAX_CONCURRENT:2}
    wait-for-slot: 30s
    # 사용자 x 기능별 AI 호출 한도 (슬라이딩 윈도, 서버 메모리). PT-97 정책 승인 대기 (임시값)
    quota:
      screen-auto:
        limit: 120
        window: 1h
      screen-manual:
        limit: 30
        window: 1h
      chat:
        limit: 60
        window: 1h
      quiz-generate:
        limit: 20
        window: 1h
      cleanup-interval: 10m
  livekit:
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    public-url: /livekit
  storage:
    mode: ${MATERIAL_STORAGE:local}
    local-path: ${MATERIAL_LOCAL_PATH:./data/materials}
