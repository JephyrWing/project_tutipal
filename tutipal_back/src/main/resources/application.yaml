spring:
  application:
    name: tutipal-back
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/tutipal_db}
    username: ${DB_USER:tutipal}
    password: ${DB_PW}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  autoconfigure:
    # 실제 사용자 저장소를 구현하기 전 임시 기본 사용자/비밀번호 생성을 막는다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  tomcat:
    max-part-header-size: 2KB
  forward-headers-strategy: none
  servlet:
    session:
      # 유휴 제한. 절대 제한은 app.session.absolute-timeout
      timeout: ${SESSION_IDLE_TIMEOUT:2h}
      cookie:
        name: TUTIPAL_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

tutipal:
  ai:
    base-url: ${FAST_API_BASE_URL:http://fastapi:8000}
  livekit:
    internal-url: ${LIVEKIT_INTERNAL_URL:http://livekit:7880}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    # 실제 토큰 생성에서도 false를 강제한다.
    can-publish-data: false
    token-ttl: 60s
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET:}
  # PT-86: 검색 후보 재순위화 (FastAPI /v1/rerank, 주소·내부 키는 app.ai.*). 계약: docs/AI_WORKFLOW_CONTRACT.md 3.1
  # 환경 변수로 바꿀 때: TUTIPAL_RAG_RERANK_ENABLED=true 등 (relaxed binding)
  rag:
    rerank:
      enabled: false
      # 켰을 때 가져올 후보 수 (1..32 로 보정). 측정·동결값 10 (docs/PT-86_RAG_EVAL.md 3)
      candidates: 10
      timeout: 2s
      # 0.5 필터 뒤 후보가 이보다 적으면 재순위화하지 않음
      min-candidates: 2
  materials:
    # char800-v1 (기존 문단·800자) | section-v1 (제목 경로·문장 단위). 바꾸면 docs/RAG_REINDEX.md
    chunker: char800-v1

app:
  # local 프로필(prod 제외)에서만 true 허용. 그 밖에서 true 면 DevLoginGuard 가 시작을 막는다.
  dev-login: ${DEV_LOGIN:false}
  session:
    # 로그인 세션 절대 제한 (HTTP 필터 · STOMP · LiveKit 공통)
    absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
  # 포트 자리는 [*] 로 쓴다 ("*" 는 localhost:5173.evil.com 같은 호스트도 맞아 버린다)
  allowed-origins: "${APP_ALLOWED_ORIGINS:http://127.0.0.1:[*],http://localhost:[*]}"
  ai:
    base-url: ${FAST_API_BASE_URL:http://fastapi:8000}
    internal-key: ${AI_INTERNAL_KEY:}
    max-concurrent: ${AI_MAX_CONCURRENT:2}
    wait-for-slot: 30s
    # PT-85 학생 · 개인 학습 Agent (/v1/agent/chat). 기본 false = 모든 역할이 기존 /v1/chat 경로. FastAPI 배포 확인 후 true
    agent:
      enabled: ${AI_AGENT_ENABLED:false}
    # 사용자 x 기능별 AI 호출 한도 (슬라이딩 윈도, 서버 메모리). PT-97 정책 승인 대기 (임시값)
    quota:
      screen-auto:
        limit: 120
        window: 1h
      screen-manual:
        limit: 30
        window: 1h
      chat:
        limit: 60
        window: 1h
      quiz-generate:
        limit: 20
        window: 1h
      cleanup-interval: 10m
    # PT-106 저장 AI 대화. retention-days 0 = 자동 삭제 끔 (보관 기간 PT-13 미정: 사용자 삭제 · 탈퇴 때까지 보관)
    conversations:
      retention-days: ${AI_CONVERSATION_RETENTION_DAYS:0}
      retention-batch-size: 500
      # 사용자가 지운 대화 · 기억(soft delete)을 물리 삭제하기 전 유예 일수. 1 이상, 기본 30 (PT-13 결정 전 임시값)
      deleted-purge-days: ${AI_CONVERSATION_DELETED_PURGE_DAYS:30}
      # 활성 요약 뒤 메시지 중 최신 keep-recent 개를 뺀 수가 threshold 이상이면 오래된 것부터 최대 max-input 개 요약
      summary:
        threshold: 20
        keep-recent: 6
        max-input: 40
        slot-wait: 5s
        # 서버 전체 동시 요약 수. 1 = 요약이 AiSlots 자리를 하나만 써서 채팅 자리를 남긴다 (자리가 없으면 건너뜀)
        max-concurrent: 1
        # FastAPI 로 보내는 요약 입력 글자 합계 상한 (FastAPI 가 모델 문맥에 맞게 다시 줄인다)
        max-input-chars: 12000
  livekit:
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    public-url: /livekit
  storage:
    mode: ${MATERIAL_STORAGE:local}
    local-path: ${MATERIAL_LOCAL_PATH:./data/materials}
