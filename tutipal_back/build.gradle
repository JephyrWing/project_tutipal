plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.my'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation platform('software.amazon.awssdk:bom:2.59.2')
    implementation 'software.amazon.awssdk:s3'
    implementation 'io.livekit:livekit-server:0.17.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // JUnit 5 + AssertJ + Mockito. CI spring-test 잡에서 실행한다 (PT-25).
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/ReviewStorePostgresTest.class'
    exclude '**/RagSearchRepositoryPostgresTest.class'
    exclude '**/FocusStorePostgresTest.class'
}

// PT-53: 실제 DB 검사는 별도 일회용 DB/CI에서 실행한다. env 누락은 skip 대신 실패한다.
tasks.register('reviewDbTest', Test) {
    description = 'Runs review boundary and privacy checks against disposable PostgreSQL/pgvector'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/ReviewStorePostgresTest.class'
}

// PT-86: RAG 검색 SQL(세션·임베딩 모델·인덱싱 필터, 정확 코사인 순서)과 V20 을 일회용 PostgreSQL/pgvector 에서 확인한다.
tasks.register('ragDbTest', Test) {
    description = 'Runs RAG search repository checks against disposable PostgreSQL/pgvector'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/RagSearchRepositoryPostgresTest.class'
}

// PT-90: V23 제약 · 동의 행 잠금(FOR SHARE)과 철회의 직렬화 · 탈퇴와 철회 동시 실행 · 보관 삭제를 일회용 PostgreSQL 에서 확인한다.
tasks.register('focusDbTest', Test) {
    description = 'Runs focus check storage, locking and retention checks against disposable PostgreSQL'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/FocusStorePostgresTest.class'
}

// PT-86: RAG 평가 하네스 (src/ragEval). test · build 에 포함되지 않는다. 사용법은 docs/PT-86_RAG_EVAL.md
sourceSets {
    ragEval {
        // testCompileClasspath carries compile-only API jars (apiguardian) used by the JUnit guard tests
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testCompileClasspath + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
    }
}

tasks.register('ragEval', JavaExec) {
    description = 'PT-86 RAG evaluation harness (needs local FastAPI/Ollama; not part of test or build)'
    group = 'verification'
    classpath = sourceSets.ragEval.runtimeClasspath
    mainClass = 'com.my.tutipal_back.materials.service.RagEvalMain'
    workingDir = projectDir
    maxHeapSize = '512m'
    args((project.findProperty('evalArgs') ?: '').toString().split(' ').findAll { it })
}

// PT-86: unit tests of the harness guards (sealed hash abort, scored-once rule). Not part of test/build; CI runs it.
tasks.register('ragEvalTest', Test) {
    description = 'Runs the PT-86 eval harness guard tests (src/ragEval)'
    group = 'verification'
    testClassesDirs = sourceSets.ragEval.output.classesDirs
    classpath = sourceSets.ragEval.runtimeClasspath
    useJUnitPlatform()
    include '**/*Test.class'
}

tasks.named('bootJar') {
    archiveFileName = 'server.jar'
}

tasks.named('jar') {
    enabled = false
}
